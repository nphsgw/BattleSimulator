name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra all

      - name: Run all quality gates
        run: make check
