minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: battlesim-check
        name: BattleSimulator quality gates
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
