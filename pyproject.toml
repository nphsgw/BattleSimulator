[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "battlesim"
version = "0.4.0"
description = "Modelling and animating simulated battles between units in Python."
requires-python = ">=3.12"
authors = [
    {name = "Greg Parkes"}
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
dependencies = [
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "matplotlib>=3.10.8",
    "numba>=0.64.0",
    "pydantic>=2.12",
]
keywords = ["simulation", "battle", "tabs"]
classifiers=[
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
all = [
    "tqdm>=4.67.3",
    "pytest>=9.0.2",
    "black>=26.3.1",
    "ruff>=0.15.6",
    "ty",
    "streamlit>=1.40",
    "mypy>=2.3",
    "hypothesis>=6.0",
    "pandas-stubs>=3.0",
]
notebook = ["jupyter>=1.1.1", "ipywidgets>=8.1.7"]
app = ["streamlit>=1.40"]

[project.scripts]
battlesim-render = "battlesim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["battlesim*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"
root = ["."]

[tool.ty.src]
include = ["apps", "battlesim", "tests"]
exclude = ["examples", "teaching"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = [
    "battlesim/_scenario_input.py",
    "battlesim/contracts.py",
    "battlesim/scenario.py",
    "battlesim/randomness.py",
    "battlesim/dataset.py",
    "battlesim/validation.py",
    "battlesim/plot/_viewmodel.py",
    "tests/test_input_validation.py",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[project.urls]
Homepage = "https://github.com/gregparkes/BattleSimulator"
Changelog = "https://github.com/gregparkes/BattleSimulator/blob/master/CHANGELOG.md"

[tool.pylint]
max-line-length = 120
disable = [
    "C0103", # invalid name
    "C0209", # consider f-string
]

[tool.black]
exclude = "battlesim/__*.py"
