[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "battlesim"
version = "0.4.0"
description = "Modelling and animating simulated battles between units in Python."
requires-python = ">=3.12"
authors = [
    {name = "Greg Parkes"}
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
dependencies = [
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "matplotlib>=3.10.8",
    "numba>=0.64.0",
    "pydantic>=2.12",
]
keywords = ["simulation", "battle", "tabs"]
classifiers=[
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
all = [
    "tqdm>=4.67.3",
    "types-tqdm",
    "pytest>=9.0.2",
    "black>=26.3.1",
    "ruff>=0.15.6",
    "streamlit>=1.60",
    "mypy>=2.3",
    "hypothesis>=6.0",
    "pandas-stubs>=3.0",
    "pre-commit>=4.0",
]
notebook = ["jupyter>=1.1.1", "ipywidgets>=8.1.7"]
app = ["streamlit>=1.60"]

[project.scripts]
battlesim-render = "battlesim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["battlesim*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
follow_imports = "silent"
show_error_codes = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
files = ["apps", "battlesim", "tests"]
exclude = ["examples", "teaching"]

# 厳格対象(旧 `mypy --strict` 対象)。`strict` は module 単位で指定できないため、
# strict が有効にするフラグを個別に列挙する。対象を縮小しないこと。
[[tool.mypy.overrides]]
module = [
    "battlesim._scenario_input",
    "battlesim.contracts",
    "battlesim.scenario",
    "battlesim.randomness",
    "battlesim.dataset",
    "battlesim.placement",
    "battlesim.validation",
    "battlesim.plot._viewmodel",
    "tests.test_input_validation",
]
warn_unreachable = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[project.urls]
Homepage = "https://github.com/gregparkes/BattleSimulator"
Changelog = "https://github.com/gregparkes/BattleSimulator/blob/master/CHANGELOG.md"

[tool.pylint]
max-line-length = 120
disable = [
    "C0103", # invalid name
    "C0209", # consider f-string
]

[tool.black]
exclude = "battlesim/__*.py"
